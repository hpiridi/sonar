# Benchmark configuration for SONAR Small dataset
# Reproduces the results in Table 5 of the paper

dataset_name: small
epoch: 5
contamination: 0.1
gpu: 0
batch_size: 0  # full-batch

detectors:
  - ANOMALOUS
  - AnomalyDAE
  - CoLA
  - CONAD
  - DOMINANT
  - DONE
  - GAE       # Note: PyGOD's GAE is actually GCNAE (GCN autoencoder)
  - OCGNN
  - ONE
  - AdONE
